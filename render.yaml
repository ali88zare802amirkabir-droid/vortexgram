services:
  - type: web
    name: fake-telegram
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: ADMIN_PHONES
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEYS_STR
        sync: false
      - key: KAVENEGAR_KEY
        sync: false
      - key: VX_ALLOWED_ORIGIN
        sync: false
      # ---- Cloudflare R2 برای ذخیره‌سازی بادوام ----
      # اگر این ۴ متغیر تنظیم نشود، آپلودها روی دیسک موقت کانتینر می‌افتد و
      # با هر restart/deploy پاک می‌شود (همان مشکل «نمی‌توانم عکس را ببینم»).
      # مقادیر را در داشبورد Render > Environment وارد کن (sync:false).
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false