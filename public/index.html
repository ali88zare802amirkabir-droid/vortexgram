<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>VORTEX Messenger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="style.css?v=70" />
  <script src="icons.js?v=68"></script>
</head>
<body>
  <div id="auth-screen">
    <div class="auth-box">
      <div class="brand">VORTEX<b>Messenger</b></div>
      <p class="tag">// پروتکل گیمینگ ۲۱۲۶ — پیام‌رسان نسل بعدی</p>
      <div id="auth-step-phone">
        <input id="auth-phone" type="tel" inputmode="numeric" placeholder="شماره موبایل (۰۹۱۲۳۴۵۶۷۸۹)" maxlength="11" autocomplete="tel" />
        <button class="primary" id="auth-send">دریافت کد</button>
      </div>
      <div id="auth-step-code" class="hidden">
        <p id="auth-phone-label" class="hint" style="text-align:center;margin-bottom:6px"></p>
        <input id="auth-code" type="text" inputmode="numeric" placeholder="کد ۶ رقمی" maxlength="6" autocomplete="one-time-code" />
        <button class="primary" id="auth-verify">تایید کد</button>
      </div>
      <div id="auth-step-name" class="hidden">
        <input id="auth-name" type="text" placeholder="نام نمایشی" maxlength="25" />
        <input id="auth-username" type="text" placeholder="نام کاربری (اختیاری)" maxlength="20" />
        <button class="primary" id="auth-finish">ساخت حساب</button>
      </div>
      <p id="auth-error" class="auth-error"></p>
      <button class="auth-logout" id="auth-logout">خروج از حساب فعلی</button>
    </div>
  </div>

  <div id="app" class="hidden">
    <aside id="nav-sidebar">
      <button class="nav-toggle" id="nav-toggle" title="باز/بسته"><i data-lucide="panel-left-open" class="icon"></i></button>
      <div class="nav-logo"><span class="mark">V</span><b>VORTEX</b><small> Messenger</small></div>
      <div class="nav-profile" id="nav-profile">
        <div class="av sm" id="nav-av">?</div>
        <div class="meta"><div class="nm" id="nav-name">...</div><div class="st">● آنلاین</div></div>
      </div>
      <div class="nav-sep"></div>
      <div class="nav-scroll" id="nav-scroll"></div>
    </aside>

    <section id="chat-list-column">
      <div class="cl-head">
        <div class="cl-title">چت‌ها</div>
        <button class="icon-btn" id="cl-new" title="چت جدید"><i data-lucide="square-pen" class="icon"></i></button>
        <button class="icon-btn mobile-only" id="cl-menu" title="منو"><i data-lucide="menu" class="icon"></i></button>
      </div>
      <div class="cl-search"><i data-lucide="search" class="icon"></i><input id="cl-search-input" placeholder="جستجوی چت‌ها..." /></div>
      <div class="cl-tabs" id="cl-tabs">
        <div class="cl-tab active" data-tab="all">همه</div>
        <div class="cl-tab" data-tab="unread">خوانده‌نشده</div>
        <div class="cl-tab" data-tab="private">خصوصی</div>
        <div class="cl-tab" data-tab="groups">گروه‌ها</div>
        <div class="cl-tab" data-tab="channels">کانال‌ها</div>
        <div class="cl-tab" data-tab="bots">ربات‌ها</div>
      </div>
      <div class="cl-items" id="cl-items"></div>
    </section>

    <main id="conversation">
      <div class="conv-empty" id="conv-empty"></div>
      <div id="conv-main" class="hidden" style="display:flex;flex-direction:column;min-height:0;flex:1">
        <div class="conv-head">
          <button class="icon-btn mobile-only back-btn" id="conv-back"><i data-lucide="chevron-right" class="icon"></i></button>
          <div class="av md" id="conv-av"></div>
          <div class="ti"><div class="nm" id="conv-name"></div><div class="sub" id="conv-sub"></div></div>
          <div class="head-actions">
            <button class="icon-btn" id="conv-search" title="جستجو"><i data-lucide="search" class="icon"></i></button>
            <button class="icon-btn" id="conv-info" title="اطلاعات"><i data-lucide="info" class="icon"></i></button>
            <button class="icon-btn" id="conv-ai" title="هوش مصنوعی"><i data-lucide="sparkles" class="icon"></i></button>
          </div>
        </div>
        <div id="conv-searchbox" class="hidden" style="padding:8px 14px;border-bottom:1px solid var(--border)"><input id="conv-search-input" class="input" placeholder="جستجو در این چت..." /></div>
        <div id="messages"></div>
        <div id="reply-bar" class="hidden"></div>
        <div class="composer">
          <div class="tools">
            <button class="icon-btn" id="composer-attach" title="پیوست"><i data-lucide="paperclip" class="icon"></i></button>
            <input type="file" id="file-input" class="hidden" />
            <button class="icon-btn" id="composer-emoji" title="ایموجی"><i data-lucide="smile" class="icon"></i></button>
            <button class="icon-btn" id="composer-sticker" title="استیکر"><i data-lucide="sticker" class="icon"></i></button>
            <button class="icon-btn" id="composer-mic" title="ضبط صدا"><i data-lucide="mic" class="icon"></i></button>
          </div>
          <textarea id="composer-input" placeholder="پیام بنویس..." rows="1"></textarea>
          <button class="send-btn" id="composer-send"><i data-lucide="send" class="icon"></i></button>
          <span id="rec-badge" class="rec-badge hidden"></span>
          <div id="emoji-pop" class="hidden"></div>
        </div>
        <div id="upload-bar" class="hidden" style="height:4px;background:var(--surface)"><div id="upload-fill" style="height:100%;width:0;background:var(--accent)"></div></div>
      </div>
    </main>

    <aside id="details-panel"></aside>
    <div id="command-dock"></div>
  </div>

  <div id="scrim" class="hidden"></div>

  <div id="toast"></div>
  <script src="app.js?v=70"></script>
</body>
</html>
