<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VORTEXGRAM // 2126</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== AUTH ===== -->
  <div id="auth-screen">
    <div class="auth-box">
      <h1 class="brand">VORTEX<span>GRAM</span></h1>
      <p class="tagline">// پروتکل گیمینگ ۲۱۲۶ — با هوش مصنوعی Vortex</p>
      <div class="tabs">
        <button id="tab-login" class="tab active">ورود</button>
        <button id="tab-register" class="tab">ثبت‌نام</button>
      </div>
      <input id="auth-username" type="text" placeholder="نام کاربری (انگلیسی)" maxlength="20" autocomplete="username" />
      <input id="auth-password" type="password" placeholder="رمز عبور" maxlength="60" autocomplete="current-password" />
      <button id="auth-submit">ورود به آرنا</button>
      <p id="auth-error" class="auth-error"></p>
    </div>
  </div>

  <!-- ===== APP ===== -->
  <div id="app" class="hidden">
    <aside id="sidebar">
      <header class="side-head">
        <h2 class="brand small">VX<span>//2126</span></h2>
        <button id="profile-btn" class="icon-btn" title="پروفایل من">
          <span id="my-avatar" class="avatar sm"></span>
        </button>
        <button id="admin-btn" class="icon-btn hidden" title="پنل ادمین">⚙</button>
      </header>
      <div class="side-head-row">
        <div class="dm-head">PRIVATE CHATS</div>
        <button id="new-group-btn" class="icon-btn sm" title="ساخت گروه جدید">+</button>
      </div>
      <ul id="user-list"></ul>
      <div class="dm-head">GROUPS</div>
      <ul id="group-list"></ul>
    </aside>

    <main id="chat-area">
      <header id="chat-header">
        <strong id="chat-title">یک گفتگو را انتخاب کنید</strong>
        <span id="typing-indicator" class="hidden"></span>
        <button id="call-btn" class="icon-btn sm hidden" title="تماس صوتی">📞</button>
      </header>

      <div id="call-bar" class="call-bar hidden">
        <span id="call-status">در حال تماس...</span>
        <span class="spacer"></span>
        <button id="mute-btn" class="mini-btn no">🎤 قطع صدا</button>
        <button id="screen-btn" class="mini-btn">🖥 اشتراک صفحه</button>
        <button id="end-call-btn" class="send-btn" style="padding:8px 14px">قطع</button>
      </div>
      <div id="remote-media"></div>
      <div id="upload-progress" class="upload-progress hidden">
        <div class="up-info"><span id="up-name"></span><span id="up-percent">0%</span></div>
        <div class="up-track"><div id="up-fill" class="up-fill"></div></div>
      </div>
      <div id="messages"></div>
      <div class="composer">
        <button id="emoji-btn" class="icon-btn" title="ایموجی">🙂</button>
        <button id="sticker-btn" class="icon-btn" title="استیکر">🎴</button>
        <button id="attach-btn" class="icon-btn" title="ارسال فایل">📎</button>
        <input id="file-input" type="file" hidden />
        <input id="msg-input" type="text" placeholder="پیام خود را مخابره کن..." maxlength="4000" autocomplete="off" />
        <button id="send-btn" class="send-btn">SEND</button>
      </div>
      <div id="emoji-picker" class="picker hidden"></div>
      <div id="sticker-picker" class="picker hidden"></div>
    </main>
  </div>

  <!-- ===== INCOMING CALL ===== -->
  <div id="incoming-modal" class="modal hidden">
    <div class="modal-box" style="text-align:center">
      <h3>📞 تماس ورودی</h3>
      <p id="incoming-name" style="margin:14px 0;font-size:16px;font-weight:700"></p>
      <div class="row">
        <button id="accept-call" class="mini-btn ok" style="flex:1;padding:12px">پذیرفتن</button>
        <button id="reject-call" class="danger-btn" style="width:auto;flex:1">رد کردن</button>
      </div>
    </div>
  </div>

  <!-- ===== PROFILE MODAL ===== -->
  <div id="profile-modal" class="modal hidden">
    <div class="modal-box">
      <button class="modal-close" data-close="profile-modal">✕</button>
      <h3>پروفایل من</h3>
      <div class="profile-top">
        <div id="avatar-wrap" class="avatar-edit">
          <span id="profile-avatar" class="avatar lg"></span>
          <button id="avatar-btn" class="icon-btn sm" title="تغییر عکس">📷</button>
          <input id="avatar-input" type="file" accept="image/jpeg,image/png,image/webp" hidden />
        </div>
        <div class="profile-meta">
          <div id="profile-displayname" class="pd-name"></div>
          <div id="profile-username" class="pd-user"></div>
          <div id="profile-premium" class="pd-premium"></div>
        </div>
      </div>
      <label>بیوگرافی</label>
      <textarea id="bio-input" rows="3" maxlength="200" placeholder="درباره خودت بنویس..."></textarea>
      <div class="row" style="margin-top:8px">
        <span id="bio-count" class="hint" style="flex:1"></span>
        <button id="bio-btn" class="mini-btn">ذخیره بیو</button>
      </div>
      <p id="rename-status" class="hint"></p>
      <hr />
      <label>نام نمایشی (تغییر نیاز به تایید ادمین دارد)</label>
      <div class="row">
        <input id="rename-input" type="text" maxlength="25" />
        <button id="rename-btn" class="mini-btn">ثبت درخواست</button>
      </div>
      <hr />
      <button id="logout-btn" class="danger-btn">خروج از حساب</button>
    </div>
  </div>

  <!-- ===== ADMIN MODAL ===== -->
  <div id="admin-modal" class="modal hidden">
    <div class="modal-box wide">
      <button class="modal-close" data-close="admin-modal">✕</button>
      <h3>پنل ادمین</h3>
      <h4>درخواست‌های تغییر نام</h4>
      <ul id="admin-requests" class="admin-list"></ul>
      <h4>کاربران</h4>
      <ul id="admin-users" class="admin-list"></ul>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
